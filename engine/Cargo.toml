[package]
name = "p2p_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures = "0.3"
jni = "0.21"
libp2p = { version = "0.56", features = ["cbor", "identify", "kad", "macros", "noise", "quic", "request-response", "tcp", "tokio", "yamux"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
